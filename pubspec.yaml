name: justgo
description: "JustGo — corra, pedale e nade desbloqueando funções com missões."
publish_to: "none"
version: 2.8.0+27

environment:
  sdk: ">=3.4.0 <4.0.0"

# As dependências são adicionadas pelo workflow (flutter pub add) para sempre
# pegar a versão mais nova compatível. Lista em tool/deps.txt.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/js/
    - assets/web/js/vendor/
    - assets/web/css/
    - assets/web/icons/
    - assets/web/img/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/brand/icon.png"
  adaptive_icon_background: "assets/brand/icon_bg.png"
  adaptive_icon_foreground: "assets/brand/icon_fg.png"
  adaptive_icon_monochrome: "assets/brand/icon_mono.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1F6BFF"
  image: assets/brand/splash.png
  android_12:
    color: "#1F6BFF"
    image: assets/brand/splash12.png
