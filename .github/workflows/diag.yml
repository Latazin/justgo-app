name: Diagnóstico de notificações

on:
  push:
    branches: [diag]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Compilar APK (com DevTools)
        run: |
          flutter create --org com.justgo --project-name justgo --platforms android .
          rm -rf test
          cp -r native/android/. android/
          sed -i -E 's/minSdk *= *flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle* || true
          python3 tool/gradle_fix.py
          flutter pub add $(cat tool/deps.txt | tr '\n' ' ')
          flutter pub add --dev $(cat tool/dev_deps.txt | tr '\n' ' ')
          flutter pub get
          flutter build apk --release --dart-define=JG_DIAG=true
          cp build/app/outputs/flutter-apk/app-release.apk app.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          pip install websocket-client
          curl -s -X POST "https://wgorplmmlghjsyscrbki.supabase.co/rest/v1/rpc/push_pull" -H "apikey: $(grep -oP "anonKey:\s*'\K[^']+" assets/web/js/config.js)" -H "Content-Type: application/json" -d '{"tok":"00000000-0000-0000-0000-000000000000","since":null}' > sql.txt; cat sql.txt
      - uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tool/diag_run.sh > diag.txt 2>&1
      - name: Publicar resultado
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/o" && cd "$RUNNER_TEMP/o" && git init -q
          cp "$GITHUB_WORKSPACE"/diag.txt "$GITHUB_WORKSPACE"/sql.txt "$GITHUB_WORKSPACE"/*.png "$GITHUB_WORKSPACE"/logcat.txt . 2>/dev/null || true
          git add -A && git -c user.name=ci -c user.email=ci@x commit -qm diag && git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/diag-output
