name: Build APK e AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar projeto Android
        run: |
          exec > >(tee -a build.log) 2>&1
          set -x
          flutter --version
          flutter create --org com.justgo --project-name justgo --platforms android .
          rm -rf test
          cp -r native/android/. android/
          # Android 7+ (minSdk 24)
          sed -i -E 's/minSdk *= *flutter\.minSdkVersion/minSdk = 24/; s/minSdkVersion +flutter\.minSdkVersion/minSdkVersion 24/' android/app/build.gradle* || true
          grep -n "minSdk" android/app/build.gradle* || true
          python3 tool/gradle_fix.py && grep -n "proguard" android/app/build.gradle.kts
          ls android/app/src/main/res/xml

      - name: Dependências
        run: |
          exec > >(tee -a build.log) 2>&1
          set -x
          flutter pub add $(cat tool/deps.txt | tr '\n' ' ')
          flutter pub add --dev $(cat tool/dev_deps.txt | tr '\n' ' ')
          flutter pub get
          grep -A40 "^dependencies:" pubspec.yaml | tee -a build.log

      - name: Ícone e abertura
        run: |
          exec > >(tee -a build.log) 2>&1
          set -x
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Compilar APK e AAB
        id: build
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          exec > >(tee -a build.log) 2>&1
          set -x
          VER=$(grep -oP "version:\s*'\K[0-9.]+" assets/web/js/config.js | head -1)
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          # APK de instalação direta: mesma assinatura de sempre (atualiza por cima)
          flutter build apk --release --build-name="$VER" --build-number="$CODE"
          # AAB da Play Store: assinado com a chave de envio (secrets)
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload.jks\n' "$KS_PASS" "$KS_PASS" > android/key.properties
            python3 tool/sign_gradle.py
            flutter build appbundle --release --build-name="$VER" --build-number="$CODE"
          else
            echo "sem chave: AAB nao gerado"
          fi

      - name: Publicar resultado na branch build-output
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          git init -q
          cp "$GITHUB_WORKSPACE/build.log" . || echo "sem log" > build.log
          if [ -f "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk" JustGo.apk
            echo "success" > STATUS
          else
            echo "failed" > STATUS
          fi
          if [ -f "$GITHUB_WORKSPACE/build/app/outputs/bundle/release/app-release.aab" ]; then
            cp "$GITHUB_WORKSPACE/build/app/outputs/bundle/release/app-release.aab" JustGo.aab
          fi
          echo "${GITHUB_SHA}" > COMMIT
          git add -A
          git -c user.name="JustGo CI" -c user.email="ci@justgo.app" commit -qm "Build #${GITHUB_RUN_NUMBER} ($(cat STATUS))"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/build-output

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JustGo-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # testa se o APK abre num celular Android virtual (pega erros que fecham o app)
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JustGo-apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app-release.apk
            adb shell monkey -p com.justgo.justgo -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > logcat.txt || true
            adb shell pidof com.justgo.justgo > pid.txt || true
      - name: Resultado
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s pid.txt ] && ! grep -q "FATAL EXCEPTION" logcat.txt; then R=ok; else R=crash; fi
          echo "SMOKE=$R"
          git clone -q --depth 1 -b build-output "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" out && cd out
          echo "$R" > SMOKE
          grep -A40 "FATAL EXCEPTION" ../logcat.txt > crash.txt || true
          git add -A && git -c user.name="JustGo CI" -c user.email="ci@justgo.app" commit -qm "smoke: $R" && git push -q
